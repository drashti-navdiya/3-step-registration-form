<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Step Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="form-container">

        <h1>Registration Form</h1>
        <form id="myForm">
            
        <!-- STEP 1 -->
        <section id="step1" class="form-step">

            <h2>Personal Information</h2>

            <label for="name">Name</label>
            <input type="text" id="name" name="name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">

            <button type="button" id="next1">Next</button>

        </section>


        <!-- STEP 2 -->
        <section id="step2" class="form-step">

            <h2>Address Information</h2>

            <label for="address">Address</label>
            <textarea id="address" name="address"></textarea>

            <label for="city">City</label>
            <input type="text" id="city" name="city">

            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode">

            <div class="buttons">
                <button type="button" id="back2">Back</button>
                <button type="button" id="next2">Next</button>
            </div>

        </section>


        <!-- STEP 3 -->
        <section id="step3" class="form-step">

            <h2>Confirmation</h2>

            <p>Please check your information before submitting.</p>

            <div class="buttons">
                <button type="button" id="back3">Back</button>
                <button type="submit" id="submit">Submit</button>
            </div>

        </section>
        </form>
    </div>


    <script src="js/script.js"></script>

</body>
</html>
